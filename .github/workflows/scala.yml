name: zio-tarantool CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  scalafmt:
    name: scalafmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ adopt@1.11 ]
        scala: [ 3.3.6 ]
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Java and Scala
        uses: olafurpg/setup-scala@v10
        with:
          java-version: ${{ matrix.java }}

      - name: scalafmt
        run: sbt ++${{ matrix.scala }} scalafmtCheckAll

  validate:
    name: Scala ${{ matrix.scala }}, Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        java: [adopt@1.11]
        scala: [2.12.20, 2.13.18, 3.3.6]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Java and Scala
        uses: olafurpg/setup-scala@v10
        with:
          java-version: ${{ matrix.java }}

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
            ~/AppData/Local/Coursier/Cache/v1
            ~/Library/Caches/Coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Run tests
        run: sbt ++${{ matrix.scala }} test

      - name: Convert JUnit XML to CTRF
        if: always()
        run: |
          mkdir -p ctrf
          npx junit-to-ctrf "core/target/test-reports/*.xml" \
            -o ctrf/ctrf-report.json -t sbt

      - name: Upload CTRF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-${{ matrix.scala }}
          path: ctrf/ctrf-report.json
          if-no-files-found: ignore

      - name: Publish job summary
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/ctrf-report.json'
          title: 'Scala ${{ matrix.scala }}'
          github-report: true
          failed-report: true
          annotate: true
          exit-on-no-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: Test report
    needs: validate
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download CTRF artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ctrf-*
          path: ctrf-all
          merge-multiple: false

      - name: Publish aggregated PR report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'ctrf-all/**/*.json'
          title: 'All Scala versions'
          pull-request-report: ${{ github.event_name == 'pull_request' }}
          failed-report: true
          overwrite-comment: true
          comment-tag: ctrf-all-scala
          exit-on-no-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
